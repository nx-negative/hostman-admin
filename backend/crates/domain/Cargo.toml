[package]
name = "domain"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = "0.1.92"
sea-orm = { version = "2.0.2", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-json", "with-uuid", "with-time"] }
sea-orm-migration = { version = "2.0.2", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
serde = "1.0.229"
serde_json = "1.0.151"
time = "0.3.55"
uuid = { version = "1.26.0", features = ["v7", "serde"] }
