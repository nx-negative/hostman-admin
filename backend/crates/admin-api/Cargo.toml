[package]
name = "admin-api"
version.workspace = true
edition.workspace = true

[[bin]]
name = "admin-api"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
common = { version = "0.1.0", path = "../common" }
domain = { version = "0.1.0", path = "../domain" }
http-body-util = "0.1.5"
sea-orm = { version = "2.0.2", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-json", "with-uuid", "with-time"] }
serde = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "cors", "limit", "compression-gzip"] }
tracing = "0.1.44"
