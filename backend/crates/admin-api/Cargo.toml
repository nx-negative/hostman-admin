[package]
name = "admin-api"
version.workspace = true
edition.workspace = true

[[bin]]
name = "admin-api"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
common = { version = "0.1.0", path = "../common" }
domain = { version = "0.1.0", path = "../domain" }
dotenvy = "0.15.7"
ed25519-dalek = { version = "3.0.0", features = ["pem"] }
http-body-util = "0.1.5"
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }
rand = "0.10.2"
sea-orm = { version = "2.0.2", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-json", "with-uuid", "with-time"] }
serde = "1.0.229"
serde_json = "1.0.151"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "cors", "limit", "compression-gzip"] }
tracing = "0.1.44"
uuid = { version = "1.26.0", features = ["v7", "serde"] }
