[package]
name = "common"
version.workspace = true
edition.workspace = true

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = "0.8.9"
base64 = "0.23.1"
config = "0.15.25"
dotenvy = "0.15.7"
ed25519-dalek = { version = "3.0.0", features = ["pem"] }
hex = "0.4.3"
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }
rand = "0.10.2"
sea-orm = { version = "2.0.2", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-json", "with-uuid", "with-time"] }
serde = "1.0.229"
serde_json = "1.0.151"
sha2 = "0.11.0"
totp-rs = { version = "6.0.0", features = ["otpauth"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
